name: 'adventure_works'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# staging = views de limpeza | marts = tabelas finais (fato e dimensões)
# o modelo intermediário define o próprio schema no arquivo (config)
models:
  adventure_works:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
